[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8088
prefix=asterisk
enablestatic=yes

; WebSocket configuration
websocket_enabled=yes
websocket_bindaddr=0.0.0.0
websocket_bindport=8089

; SSL/TLS configuration
ssl_enabled=yes
ssl_cert_file=/etc/asterisk/keys/asterisk.pem
ssl_priv_key_file=/etc/asterisk/keys/asterisk.key

; CORS configuration
cors_origin=*
cors_headers=*
