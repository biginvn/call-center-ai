;=== Extension 1000 Configuration ===
; Thêm vào file /etc/asterisk/pjsip.conf

; Transport configuration
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089
cert_file=/etc/asterisk/keys/asterisk.pem
priv_key_file=/etc/asterisk/keys/asterisk.key

; Extension 1000 AOR
[1000]
type=aor
max_contacts=5
remove_existing=yes
qualify_frequency=30

; Extension 1000 Auth
[1000]
type=auth
auth_type=userpass
username=1000
password=1234

; Extension 1000 Endpoint
[1000]
type=endpoint
aors=1000
auth=1000
context=internal
dtls_auto_generate_cert=yes
webrtc=yes
disallow=all
allow=opus,ulaw
transport=transport-wss
